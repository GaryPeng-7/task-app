spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true # Hibernate prints every SQL statement it executes to the console.
                   # This is the whole point of the week: you watch the ORM work
    open-in-view: false
    properties:
      hibernate:
        format_sql: true # pretty-prints that SQL with indentation instead of one 300-character line.

jwt:
  secret: ${JWT_SECRET} # a long random string ? at least 256 bits (32+ chars). Generate one: openssl rand -base64 48
  expiration-ms: 3600000   # 1 hour

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # logs the actual parameter values bound into the ? placeholders.
